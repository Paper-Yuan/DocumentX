<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#101215">
  <title>SafeDrop 极速快传 - 局域网收发门户</title>
  <style>
    /* =========================================================
       SafeDrop portal - "本地仪表台"
       Ink-first: neutral surfaces carry structure, colour is reserved for state.
       No brand gradient, no glow, no frosted panels, no network fonts - this page is
       served from a phone over a LAN, where a webfont would simply never arrive.
       Radii 4/8/12. Shadows on floating layers only.
       ========================================================= */
    :root {
      --font-family: system-ui, "Segoe UI Variable Text", "Segoe UI", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-data: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, "Liberation Mono", monospace;
      --radius-xs: 4px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 12px;
      --radius-full: 9999px;
      --ease-out: cubic-bezier(0.22, 0.61, 0.36, 1);
      --dur-1: 120ms;
      --dur-2: 180ms;
      --transition: background-color var(--dur-1) var(--ease-out),
                    border-color var(--dur-1) var(--ease-out),
                    color var(--dur-1) var(--ease-out),
                    box-shadow var(--dur-1) var(--ease-out);
    }

    body.dark-theme {
      --bg-base: #101215;
      --bg-surface: #16191D;
      --bg-card: #1D2126;
      --bg-card-hover: #23282E;
      --border-color: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.14);
      --border-active: rgba(255, 255, 255, 0.24);
      --text-primary: #E8EBED;
      --text-secondary: #A6ADB4;
      --text-muted: #79818A;
      /* Interactive ink, not hue. On dark the loudest surface is near-white. */
      --accent: #F2F4F5;
      --accent-text: #0B0D0F;
      --accent-hover: #FFFFFF;
      --focus-ring: #F2F4F5;
      --success: #57B383;
      --progress: #6FA9DC;
      --warning: #D9A441;
      --danger: #E0776C;
      --offline: #7C848C;
      --success-bg: rgba(87, 179, 131, 0.12);
      --progress-bg: rgba(111, 169, 220, 0.12);
      --warning-bg: rgba(217, 164, 65, 0.12);
      --danger-bg: rgba(224, 119, 108, 0.12);
      --ink-quiet: rgba(242, 244, 245, 0.14);
      --scrim: rgba(6, 7, 9, 0.62);
      --shadow-float: 0 8px 24px -12px rgba(0, 0, 0, 0.45);
      --header-bg: #16191D;
    }

    /* Warm paper identity, same ink + semantic system as the other two themes. */
    body.eyecare-theme {
      --bg-base: #EDE7D8;
      --bg-surface: #F4EFE2;
      --bg-card: #FBF7EC;
      --bg-card-hover: #FFFFFF;
      --border-color: rgba(20, 22, 25, 0.12);
      --border-strong: rgba(20, 22, 25, 0.18);
      --border-active: rgba(20, 22, 25, 0.24);
      --text-primary: #1F1C17;
      --text-secondary: #4C463D;
      --text-muted: #6E6759;
      --accent: #16181B;
      --accent-text: #FFFFFF;
      --accent-hover: #000000;
      --focus-ring: #16181B;
      --success: #1E6A42;
      --progress: #26609B;
      --warning: #7E5210;
      --danger: #A63C33;
      --offline: #7A746A;
      --success-bg: rgba(30, 106, 66, 0.10);
      --progress-bg: rgba(38, 96, 155, 0.10);
      --warning-bg: rgba(126, 82, 16, 0.10);
      --danger-bg: rgba(166, 60, 51, 0.10);
      --ink-quiet: rgba(22, 24, 27, 0.08);
      --scrim: rgba(46, 41, 32, 0.34);
      --shadow-float: 0 8px 24px -12px rgba(46, 41, 32, 0.32);
      --header-bg: #F4EFE2;
    }

    body.light-theme {
      --bg-base: #F5F6F7;
      --bg-surface: #FFFFFF;
      --bg-card: #FFFFFF;
      --bg-card-hover: #F5F6F7;
      --border-color: rgba(20, 22, 25, 0.12);
      --border-strong: rgba(20, 22, 25, 0.16);
      --border-active: rgba(20, 22, 25, 0.24);
      --text-primary: #16181B;
      --text-secondary: #4A5158;
      --text-muted: #6C747C;
      --accent: #16181B;
      --accent-text: #FFFFFF;
      --accent-hover: #000000;
      --focus-ring: #16181B;
      --success: #1F6E44;
      --progress: #2C6FB3;
      --warning: #8A5A12;
      --danger: #B4453C;
      --offline: #7C848C;
      --success-bg: rgba(31, 110, 68, 0.10);
      --progress-bg: rgba(44, 111, 179, 0.10);
      --warning-bg: rgba(138, 90, 18, 0.10);
      --danger-bg: rgba(180, 69, 60, 0.10);
      --ink-quiet: rgba(22, 24, 27, 0.06);
      --scrim: rgba(20, 22, 25, 0.32);
      --shadow-float: 0 8px 24px -12px rgba(20, 22, 25, 0.28);
      --header-bg: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-family);
      font-variant-numeric: tabular-nums;
      background-color: var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 200ms linear, color 200ms linear;
      overflow-x: hidden;
    }

    :focus { outline: none; }

    :focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
      border-radius: var(--radius-xs);
    }

    /* Every machine value reads as one: address, size, speed, chunk count, code. */
    .data {
      font-family: var(--font-data);
      font-variant-numeric: tabular-nums;
    }

    .eyebrow {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    /* Header */
    .portal-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: var(--header-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-logo {
      width: 26px;
      height: 26px;
      border-radius: var(--radius-xs);
      background: var(--accent);
      color: var(--accent-text);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-logo svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
    }

    .brand-info h1 {
      font-size: 15px;
      font-weight: 650;
      line-height: 1.25;
      letter-spacing: -0.01em;
    }

    .brand-info p {
      font-size: 11.5px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* A bare status dot: state, so it may carry colour - and it clears 3:1
       against every surface here. */
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: var(--radius-full);
      background-color: var(--success);
      display: inline-block;
      flex-shrink: 0;
      animation: liveTick 2.4s ease-in-out infinite;
    }

    @keyframes liveTick {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .theme-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: var(--transition);
    }

    .theme-btn:hover {
      border-color: var(--border-active);
      color: var(--text-primary);
    }

    /* Container */
    .portal-container {
      max-width: 720px;
      margin: 0 auto;
      width: 100%;
      padding: 16px 14px 56px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Host info banner */
    .host-banner-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .host-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .host-avatar {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-sm);
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .host-avatar svg {
      width: 18px;
      height: 18px;
    }

    .host-details {
      min-width: 0;
    }

    .host-details h2 {
      font-size: 14px;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .host-details span {
      font-size: 11.5px;
      color: var(--text-muted);
      font-family: var(--font-data);
      font-variant-numeric: tabular-nums;
    }

    .auth-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      font-size: 11.5px;
      font-weight: 600;
      background: var(--bg-card);
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
    }

    .auth-badge svg {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
    }

    .auth-badge.unlocked {
      background: var(--success-bg);
      color: var(--success);
      border-color: transparent;
    }

    .auth-badge.locked {
      background: var(--warning-bg);
      color: var(--warning);
      border-color: transparent;
    }

    /* Tabs */
    .portal-tabs {
      display: flex;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 3px;
      gap: 3px;
    }

    .portal-tab-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-family: var(--font-family);
      font-size: 13px;
      font-weight: 600;
      padding: 9px 8px;
      border-radius: calc(var(--radius-sm) - 2px);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      /* The two labels are the whole explanation of what each tab does; they wrap
         on a narrow phone instead of being cut off at the edge. */
      min-width: 0;
      white-space: normal;
      line-height: 1.3;
      text-align: center;
      transition: var(--transition);
    }

    .portal-tab-btn svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    .portal-tab-btn.active {
      background: var(--accent);
      color: var(--accent-text);
    }

    /* Sections */
    .portal-section {
      display: none;
      flex-direction: column;
      gap: 14px;
    }

    .portal-section.active {
      display: flex;
      animation: paneFade 160ms var(--ease-out);
    }

    @keyframes paneFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Upload card */
    .upload-card {
      background: var(--bg-surface);
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius-md);
      padding: 22px 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      position: relative;
      transition: var(--transition);
    }

    .upload-card:hover, .upload-card.dragover {
      border-color: var(--accent);
      border-style: solid;
      background: var(--bg-card);
    }

    .upload-icon-circle {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      background: var(--ink-quiet);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .upload-icon-circle svg {
      width: 17px;
      height: 17px;
    }

    .upload-title {
      font-size: 14px;
      font-weight: 600;
    }

    .upload-desc {
      font-size: 12px;
      color: var(--text-muted);
      max-width: 420px;
      line-height: 1.6;
    }

    .btn-select-file {
      background: var(--accent);
      color: var(--accent-text);
      border: 1px solid var(--accent);
      font-family: var(--font-family);
      font-size: 13px;
      font-weight: 600;
      padding: 9px 16px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: var(--transition);
    }

    .btn-select-file:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .btn-select-file:active {
      transform: translateY(1px);
    }

    .btn-select-file svg {
      width: 14px;
      height: 14px;
    }

    /* Upload task list */
    .task-queue-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .card-title-row h3 {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .task-stats {
      font-size: 11.5px;
      color: var(--text-muted);
      font-family: var(--font-data);
      font-variant-numeric: tabular-nums;
    }

    .task-items-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .task-item {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .task-item-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .task-file-name {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .task-status-badge {
      font-family: var(--font-data);
      font-variant-numeric: tabular-nums;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      background: var(--bg-surface);
      color: var(--text-secondary);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .task-status-badge.transferring {
      background: var(--progress-bg);
      color: var(--progress);
    }

    .task-status-badge.done {
      background: var(--success-bg);
      color: var(--success);
    }

    .task-status-badge.error {
      background: var(--danger-bg);
      color: var(--danger);
    }

    .task-progress-bar {
      height: 6px;
      background: var(--ink-quiet);
      border-radius: var(--radius-full);
      overflow: hidden;
    }

    .task-progress-fill {
      height: 100%;
      background: var(--progress);
      width: 0%;
      border-radius: var(--radius-full);
      transition: width var(--dur-2) var(--ease-out);
    }

    .task-progress-fill.done { background: var(--success); }
    .task-progress-fill.error { background: var(--danger); }

    .task-item-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-family: var(--font-data);
      font-variant-numeric: tabular-nums;
      font-size: 11px;
      color: var(--text-muted);
    }

    .task-error {
      font-size: 12px;
      line-height: 1.55;
      color: var(--text-secondary);
      border-left: 2px solid var(--danger);
      padding-left: 8px;
    }

    .task-error strong {
      color: var(--danger);
      font-weight: 600;
    }

    .task-actions {
      display: flex;
      gap: 8px;
    }

    .btn-mini {
      background: var(--bg-surface);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      font-family: var(--font-family);
      font-size: 12px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-mini:hover {
      border-color: var(--border-active);
    }

    .btn-mini.is-primary {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
    }

    /* Files list */
    .files-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .files-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .file-row {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: var(--transition);
    }

    .file-row:hover {
      border-color: var(--border-active);
    }

    .file-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .file-icon-box {
      width: 30px;
      height: 30px;
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .file-icon-box svg {
      width: 15px;
      height: 15px;
    }

    .file-meta {
      display: flex;
      flex-direction: column;
      min-width: 0;
      gap: 1px;
    }

    .file-name {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-subtext {
      font-size: 11px;
      color: var(--text-muted);
      font-family: var(--font-data);
      font-variant-numeric: tabular-nums;
    }

    .btn-download-file {
      background: var(--bg-surface);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      font-family: var(--font-family);
      font-size: 12px;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: var(--transition);
      flex-shrink: 0;
    }

    .btn-download-file:hover {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
    }

    .btn-download-file svg {
      width: 13px;
      height: 13px;
    }

    .empty-placeholder {
      padding: 26px 16px;
      text-align: center;
      color: var(--text-muted);
      font-size: 12.5px;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      border: 1px dashed var(--border-color);
      border-radius: var(--radius-sm);
    }

    .empty-placeholder svg { display: none; }

    .empty-placeholder p {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }

    /* Pairing dialog. It has to survive a 320px-wide phone, so the digit cells
       flex instead of holding a fixed width. */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: var(--scrim);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 14px;
      animation: scrimIn 140ms var(--ease-out);
    }

    @keyframes scrimIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-overlay.active {
      display: flex;
    }

    .pin-modal-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      padding: 18px 16px;
      width: 100%;
      max-width: 380px;
      max-height: calc(100vh - 28px);
      overflow-y: auto;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: var(--shadow-float);
      animation: layerIn 160ms var(--ease-out);
    }

    @keyframes layerIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .pin-modal-icon {
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
    }

    .pin-modal-icon svg {
      width: 17px;
      height: 17px;
    }

    .pin-modal-card h3 {
      font-size: 15px;
      font-weight: 650;
    }

    .pin-modal-card p {
      font-size: 12.5px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .pin-inputs-row {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin: 4px 0;
    }

    .pin-digit-input {
      flex: 1 1 0;
      min-width: 0;
      max-width: 46px;
      height: 48px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: var(--bg-card);
      color: var(--text-primary);
      font-family: var(--font-data);
      font-variant-numeric: tabular-nums;
      font-size: 20px;
      font-weight: 600;
      text-align: center;
      padding: 0;
      transition: var(--transition);
    }

    .pin-digit-input:focus-visible {
      border-color: var(--accent);
      outline: 2px solid var(--focus-ring);
      outline-offset: 1px;
    }

    .pin-inputs-row.has-error .pin-digit-input {
      border-color: var(--danger);
    }

    .pin-modal-error {
      display: none;
      font-size: 12px;
      line-height: 1.55;
      color: var(--danger);
      text-align: left;
    }

    .pin-modal-error.visible {
      display: block;
    }

    .pin-modal-error .hint {
      display: block;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .pin-modal-footnote {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .pin-rerequest {
      background: none;
      border: none;
      font-family: var(--font-family);
      font-size: 12px;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 2px;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .pin-rerequest:hover {
      color: var(--text-primary);
    }

    /* Toast */
    .toast-box {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      color: var(--text-primary);
      padding: 9px 14px;
      border-radius: var(--radius-sm);
      font-size: 12.5px;
      font-weight: 500;
      box-shadow: var(--shadow-float);
      z-index: 300;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--dur-2) var(--ease-out), transform var(--dur-2) var(--ease-out);
      max-width: calc(100vw - 28px);
    }

    .toast-box.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .portal-container {
        padding: 12px 10px 48px;
        gap: 12px;
      }

      .host-banner-card {
        flex-direction: column;
        align-items: flex-start;
      }

      .upload-card {
        padding: 18px 14px;
      }

      .upload-title {
        font-size: 13.5px;
      }

      .btn-select-file {
        width: 100%;
      }

      .pin-digit-input {
        height: 44px;
        font-size: 18px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>

      <p class="pin-modal-footnote">配对码只在这次连接里用：不写进存储、关掉页面就没了。这样这台手机被别人拿到时，也还原不出你们的会话。</p>
    </div>

  <!-- Toast -->
  <div class="toast-box" id="toastBox"></div>

  <script>
    (function () {
      'use strict';

      const urlParams = new URLSearchParams(window.location.search);
      let pinParam = urlParams.get('pin') || '';
      let tokenParam = urlParams.get('token') || '';
      let isVerified = false;

      /**
       * Browser-side mirror of computer-design/desktop_hub/crypto_protocol.js.
       *
       * The pairing PIN (or QR token) is used locally as HKDF input and proven with an HMAC;
       * it is never sent to the hub. Uploaded chunks are sealed with AES-256-GCM using a
       * fresh random nonce, with the task id, chunk index, chunk count and slice size bound in as
       * AAD so a chunk cannot be moved, duplicated, or completed early.
       */
      const SafeDropCrypto = (() => {
        const PROTOCOL = 'safedrop-e2e-v2';
        const NONCE_LEN = 12;
        const TAG_LEN = 16;
        const enc = new TextEncoder();

        let curve = 'x25519';

        function toHex(buf) {
          return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function fromHex(hex) {
          const out = new Uint8Array(hex.length / 2);
          for (let i = 0; i < out.length; i++) {
            out[i] = parseInt(hex.substr(i * 2, 2), 16);
          }
          return out;
        }

        function concat(...parts) {
          const total = parts.reduce((n, p) => n + p.length, 0);
          const out = new Uint8Array(total);
          let offset = 0;
          for (const p of parts) { out.set(p, offset); offset += p.length; }
          return out;
        }

        /** HKDF salt, matching deriveSalt() on the hub: SHA-256(protocol|salt|sessionId). */
        async function deriveSalt(sessionId) {
          return new Uint8Array(await crypto.subtle.digest('SHA-256', enc.encode(`${PROTOCOL}|salt|${sessionId}`)));
        }

        async function generateKeyPair() {
          // X25519 is preferred; older WebCrypto builds fall back to P-256.
          try {
            const pair = await crypto.subtle.generateKey({ name: 'X25519' }, true, ['deriveBits']);
            curve = 'x25519';
            return pair;
          } catch (_) {
            const pair = await crypto.subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveBits']);
            curve = 'p-256';
            return pair;
          }
        }

        async function exportPublicKey(pair) {
          return new Uint8Array(await crypto.subtle.exportKey('raw', pair.publicKey));
        }

        async function importPublicKey(raw) {
          if (curve === 'x25519') {
            return crypto.subtle.importKey('raw', raw, { name: 'X25519' }, false, []);
          }
          return crypto.subtle.importKey('raw', raw, { name: 'ECDH', namedCurve: 'P-256' }, false, []);
        }

        async function deriveSharedSecret(pair, serverRawPub) {
          const serverKey = await importPublicKey(serverRawPub);
          const algorithm = curve === 'x25519' ? { name: 'X25519', public: serverKey } : { name: 'ECDH', public: serverKey };
          return new Uint8Array(await crypto.subtle.deriveBits(algorithm, pair.privateKey, 256));
        }

        /**
         * Derive the 256-bit session key as raw bytes so it can serve as both an AES key and
         * an HMAC key. HKDF `info` carries the pairing secret.
         */
        async function deriveSessionKeyBytes(sharedSecret, sessionId, pairingSecret) {
          const hkdfKey = await crypto.subtle.importKey('raw', sharedSecret, 'HKDF', false, ['deriveBits']);
          const salt = await deriveSalt(sessionId);
          const info = enc.encode(`${PROTOCOL}|key|${pairingSecret}`);
          const bits = await crypto.subtle.deriveBits(
            { name: 'HKDF', hash: 'SHA-256', salt, info },
            hkdfKey,
            256
          );
          return new Uint8Array(bits);
        }

        async function hmac(keyBytes, message) {
          const key = await crypto.subtle.importKey('raw', keyBytes, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
          return new Uint8Array(await crypto.subtle.sign('HMAC', key, enc.encode(message)));
        }

        function clientProof(keyBytes, sessionId) {
          return hmac(keyBytes, `${PROTOCOL}|verify|${sessionId}`);
        }

        function serverProof(keyBytes, sessionId) {
          return hmac(keyBytes, `${PROTOCOL}|server|${sessionId}`);
        }

        async function importAesKey(keyBytes) {
          return crypto.subtle.importKey('raw', keyBytes, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
        }

        /**
         * Seal one chunk: nonce(12) || ciphertext || tag(16).
         *
         * index, count and chunkSize are bound into the AAD alongside the task id, so the receiver
         * can tell a genuine chunk from one whose "how many are there" header was rewritten on the
         * wire. chunkSize is the sender's slice size, i.e. the stride between chunk offsets.
         */
        async function encryptChunk(keyBytes, data, taskId, index, count, chunkSize) {
          const key = await importAesKey(keyBytes);
          const nonce = crypto.getRandomValues(new Uint8Array(NONCE_LEN));
          const aad = enc.encode(`${PROTOCOL}|chunk|${taskId}|${index}|${count}|${chunkSize}`);
          const sealed = new Uint8Array(await crypto.subtle.encrypt(
            { name: 'AES-GCM', iv: nonce, additionalData: aad, tagLength: 128 },
            key,
            data
          ));
          return concat(nonce, sealed);
        }

        return {
          PROTOCOL,
          NONCE_LEN,
          TAG_LEN,
          toHex,
          fromHex,
          getCurve: () => curve,
          generateKeyPair,
          exportPublicKey,
          deriveSharedSecret,
          deriveSessionKeyBytes,
          clientProof,
          serverProof,
          encryptChunk
        };
      })();

      /** Active encrypted session, if the handshake has succeeded. */
      const session = {
        id: null,
        key: null,
        get active() { return !!(this.id && this.key); }
      };

      /** Attach the session id to a request's headers once a session exists. */
      function withSession(headers = {}) {
        if (session.id) headers['X-Session-Id'] = session.id;
        return headers;
      }

      const state = {
        hostInfo: null,
        files: [],
        tasks: [],
        filesUpdatedAt: 0,
        theme: localStorage.getItem('safedrop_theme') || 'dark-theme'
      };

      const dom = {
        hostDeviceName: document.getElementById('hostDeviceName'),
        hostAddressText: document.getElementById('hostAddressText'),
        authBadge: document.getElementById('authBadge'),
        authBadgeText: document.getElementById('authBadgeText'),
        headerStatusText: document.getElementById('headerStatusText'),
        uploadDropZone: document.getElementById('uploadDropZone'),
        portalFileInput: document.getElementById('portalFileInput'),
        btnChooseFiles: document.getElementById('btnChooseFiles'),
        taskQueueCard: document.getElementById('taskQueueCard'),
        taskItemsContainer: document.getElementById('taskItemsContainer'),
        taskStatsText: document.getElementById('taskStatsText'),
        filesListContainer: document.getElementById('filesListContainer'),
        filesEmptyPlaceholder: document.getElementById('filesEmptyPlaceholder'),
        filesUpdatedAgo: document.getElementById('filesUpdatedAgo'),
        themeBtn: document.getElementById('themeBtn'),
        pinModalOverlay: document.getElementById('pinModalOverlay'),
        pinInputsRow: document.getElementById('pinInputsRow'),
        pinModalError: document.getElementById('pinModalError'),
        btnRerequestCode: document.getElementById('btnRerequestCode'),
        btnConfirmPin: document.getElementById('btnConfirmPin'),
        toastBox: document.getElementById('toastBox'),
        tabBtns: document.querySelectorAll('.portal-tab-btn'),
        sections: document.querySelectorAll('.portal-section')
      };

      // 1. Init
      async function init() {
        applyTheme(state.theme);
        initTabs();
        initThemeToggle();
        initUploadEvents();
        initPinInputs();

        await fetchHostInfo();

        if (pinParam || tokenParam) {
          // The link already carries the code, so try it straight away. On failure the sheet
          // stays open with the reason next to the cells.
          await verifyPin(pinParam, tokenParam);
        } else {
          // No silent restore: the pairing code is the shared secret, and storing it (in
          // sessionStorage or anywhere else on the device) would let anyone holding this
          // phone finish a handshake as us. Every visit asks again, on purpose.
          showPinModal();
        }

        fetchFiles();
        setInterval(fetchFiles, 6000);
        setInterval(updateFilesStamp, 1000);
      }

      // 2. Fetch host info
      async function fetchHostInfo() {
        try {
          const res = await fetch('/api/v1/info');
          if (res.ok) {
            const data = await res.json();
            state.hostInfo = data;
            const name = data.host?.name || data.name || `${window.location.hostname} (SafeDrop 端)`;
            dom.hostDeviceName.textContent = name;
            dom.hostAddressText.textContent = `${window.location.hostname}:${window.location.port || 8899}`;
            // The hub answered, so stop saying "connecting": what is actually outstanding is
            // the pairing code, and the badge next to it already says that.
            if (!session.active) dom.headerStatusText.textContent = '局域网已连通';
          }
        } catch (_) {
          dom.hostDeviceName.textContent = `${window.location.hostname} (SafeDrop 直连端)`;
        }
      }

      // 3. Verify the pairing code by proving knowledge of it over an ECDH session
      async function verifyPin(pin, token = '') {
        const pairingSecret = String(pin || token || '');
        if (!pairingSecret) {
          showPinModal('先输入对方显示的 6 位配对码。');
          return false;
        }

        // WebCrypto only exists in a secure context. Over plain http:// on a LAN address the
        // browser hides it, and without it there is no way to encrypt the upload, so fail
        // with a pointer to the HTTPS portal instead of silently sending plaintext.
        if (!window.isSecureContext || !window.crypto || !window.crypto.subtle) {
          lockBadge('这个地址不能加密');
          showPinModal('这个地址不支持加密。', '请改用桌面端显示的 https:// 开头的门户地址重新打开，再输一次配对码。');
          return false;
        }

        setPairError(null);
        setPairBusy(true);

        try {
          // a. Ephemeral key agreement
          const pair = await SafeDropCrypto.generateKeyPair();
          const rawPub = await SafeDropCrypto.exportPublicKey(pair);

          const initRes = await fetch('/api/v1/handshake/init', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              public_key: SafeDropCrypto.toHex(rawPub),
              curve: SafeDropCrypto.getCurve()
            })
          });
          if (!initRes.ok) {
            setPairError(handshakeFailure('init', initRes.status));
            return finishFailedPairing();
          }
          const initData = await initRes.json();

          // The version marker is hashed into the key derivation, so a hub on another version would
          // fail the proof two steps below and look like a mistyped pairing code. Say what it is.
          if (initData.protocol !== SafeDropCrypto.PROTOCOL) {
            setPairError({
              message: '两端的传输协议版本不一样。',
              hint: `对方是 ${initData.protocol || '未知'}，本页面是 ${SafeDropCrypto.PROTOCOL}。升级其中一端后再试。`
            });
            return finishFailedPairing();
          }

          // b. Derive the session key locally; the secret never leaves this browser
          const shared = await SafeDropCrypto.deriveSharedSecret(pair, SafeDropCrypto.fromHex(initData.server_public_key));
          const keyBytes = await SafeDropCrypto.deriveSessionKeyBytes(shared, initData.session_id, pairingSecret);

          // c. Prove we derived the same key
          const proof = SafeDropCrypto.toHex(await SafeDropCrypto.clientProof(keyBytes, initData.session_id));
          const verifyRes = await fetch('/api/v1/handshake/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ session_id: initData.session_id, proof })
          });

          if (verifyRes.ok) {
            const verifyData = await verifyRes.json();

            // d. Confirm the hub holds the same key, which authenticates the peer
            const expected = SafeDropCrypto.toHex(await SafeDropCrypto.serverProof(keyBytes, initData.session_id));
            if (verifyData.server_proof !== expected) {
              setPairError({
                message: '对方身份没有对上，已停止。',
                hint: '两端算出的会话密钥不一致。确认输入的是同一台设备显示的配对码，然后重试。'
              });
              return finishFailedPairing();
            }

            session.id = initData.session_id;
            session.key = keyBytes;
            isVerified = true;
            setPairBusy(false);
            // Deliberately nothing is written to sessionStorage or localStorage here: the code
            // is the shared secret, and a stored copy is a stored way to impersonate us.
            hidePinModal();
            dom.authBadge.className = 'auth-badge unlocked';
            dom.authBadgeText.textContent = '已连上，可以传输';
            dom.headerStatusText.textContent = '已连接，可随时传输';
            showToast('已连上对方端');
            fetchFiles();
            return true;
          }

          setPairError({
            message: '对方不认这个配对码。',
            hint: '最常见的原因是配对码已经换过一组。回到对方屏幕上读新的那组，或者点下面的「清空重填」。'
          });
          return finishFailedPairing();
        } catch (err) {
          console.warn('[SafeDrop] pairing failed:', err);
          setPairError({
            message: '连不上对方端。',
            hint: '确认这台手机还连着同一个 Wi-Fi，对方那边的 SafeDrop 还开着。'
          });
          return finishFailedPairing();
        }
      }

      /** Turn an HTTP status into wording that names the next action. */
      function handshakeFailure(stage, status) {
        if (status === 401 || status === 403) {
          return { message: '对方拒绝了这个请求。', hint: '配对码可能已经换过了。让对方重新显示一次，再输进来。' };
        }
        if (status >= 500) {
          return { message: '对方端处理失败了。', hint: `对方返回了 ${status}。过几秒再点一次「立即验证」；一直这样的话，让对方重启 SafeDrop。（握手 ${stage}）` };
        }
        return { message: '握手没有完成。', hint: `对方返回了 ${status}。（握手 ${stage}）` };
      }

      function finishFailedPairing() {
        session.id = null;
        session.key = null;
        setPairBusy(false);
        lockBadge('还没配对');
        showPinModal();
        return false;
      }

      function setPairBusy(busy) {
        if (!dom.btnConfirmPin) return;
        dom.btnConfirmPin.disabled = busy;
        dom.btnConfirmPin.textContent = busy ? '连接中…' : '立即验证';
      }

      function lockBadge(text) {
        dom.authBadge.className = 'auth-badge locked';
        dom.authBadgeText.textContent = text;
        dom.headerStatusText.textContent = '连上之后就可以传文件';
      }

      function setPairError(error) {
        if (!dom.pinModalError) return;
        dom.pinModalError.replaceChildren();
        if (!error || !error.message) {
          dom.pinModalError.classList.remove('visible');
          if (dom.pinInputsRow) dom.pinInputsRow.classList.remove('has-error');
          return;
        }
        const head = document.createElement('span');
        head.textContent = error.message;
        dom.pinModalError.appendChild(head);
        if (error.hint) {
          const hint = document.createElement('span');
          hint.className = 'hint';
          hint.textContent = error.hint;
          dom.pinModalError.appendChild(hint);
        }
        dom.pinModalError.classList.add('visible');
        if (dom.pinInputsRow) dom.pinInputsRow.classList.add('has-error');
      }

      function showPinModal(message, hint) {
        dom.pinModalOverlay.classList.add('active');
        if (message) setPairError({ message, hint });
        const cells = pinCells();
        cells.forEach(c => { c.value = ''; });
        if (cells[0]) cells[0].focus();
      }

      function hidePinModal() {
        dom.pinModalOverlay.classList.remove('active');
        setPairError(null);
        // Wipe whatever was typed: the dialog is off screen but the digits are still in the DOM.
        pinCells().forEach(c => { c.value = ''; });
      }

      function pinCells() {
        return Array.from(dom.pinModalOverlay.querySelectorAll('.pin-digit-input'));
      }

      function initPinInputs() {
        const inputs = pinCells();

        const submit = async () => {
          const code = inputs.map(i => (i.value || '').trim()).join('');
          if (code.length !== 6) {
            setPairError({
              message: `配对码是 6 位数字，现在还差 ${6 - code.length} 位。`,
              hint: '看一下对方屏幕上显示的那 6 位数字。'
            });
            return;
          }
          await verifyPin(code);
          if (!session.active) {
            inputs.forEach(i => { i.value = ''; });
            if (inputs[0]) inputs[0].focus();
          }
        };

        inputs.forEach((input, idx) => {
          input.addEventListener('input', () => {
            const digits = (input.value || '').replace(/\D/g, '');
            if (!digits) { input.value = ''; return; }
            input.value = digits[0];
            let cursor = idx + 1;
            for (const ch of digits.slice(1)) {
              if (cursor >= inputs.length) break;
              inputs[cursor].value = ch;
              cursor++;
            }
            if (inputs.every(i => (i.value || '').length === 1)) {
              submit();
              return;
            }
            inputs[Math.min(cursor, inputs.length - 1)].focus();
          });

          input.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && !input.value && idx > 0) {
              e.preventDefault();
              inputs[idx - 1].focus();
              inputs[idx - 1].value = '';
            } else if (e.key === 'ArrowLeft' && idx > 0) {
              e.preventDefault();
              inputs[idx - 1].focus();
            } else if (e.key === 'ArrowRight' && idx < inputs.length - 1) {
              e.preventDefault();
              inputs[idx + 1].focus();
            } else if (e.key === 'Enter') {
              e.preventDefault();
              submit();
            }
          });

          input.addEventListener('paste', (e) => {
            const text = (e.clipboardData || window.clipboardData).getData('text');
            if (!text) return;
            e.preventDefault();
            const digits = text.replace(/\D/g, '').slice(0, 6);
            if (!digits) return;
            inputs.forEach(i => { i.value = ''; });
            digits.split('').forEach((ch, i) => { inputs[i].value = ch; });
            const next = Math.min(digits.length, inputs.length - 1);
            inputs[next].focus();
            if (digits.length === 6) submit();
          });
        });

        dom.btnConfirmPin.addEventListener('click', submit);

        // The hub rotates its code whenever a device finishes pairing, so the number on the
        // peer's screen may already be a generation old. Nothing here can read the peer's new
        // code for us - that would stop it being a secret - so this clears the field and sends
        // the user back to the other screen.
        if (dom.btnRerequestCode) {
          dom.btnRerequestCode.addEventListener('click', () => {
            inputs.forEach(i => { i.value = ''; });
            setPairError(null);
            showToast('已清空，请输对方屏幕上的新配对码');
            if (inputs[0]) inputs[0].focus();
          });
        }
      }

      // 4. File Upload (1MB chunked stream)
      function initUploadEvents() {
        dom.btnChooseFiles.addEventListener('click', (e) => {
          e.stopPropagation();
          dom.portalFileInput.click();
        });

        dom.uploadDropZone.addEventListener('click', () => {
          dom.portalFileInput.click();
        });

        dom.portalFileInput.addEventListener('change', (e) => {
          if (e.target.files && e.target.files.length > 0) {
            handleFiles(Array.from(e.target.files));
            dom.portalFileInput.value = '';
          }
        });

        ['dragenter', 'dragover'].forEach(name => {
          dom.uploadDropZone.addEventListener(name, (e) => {
            e.preventDefault();
            e.stopPropagation();
            dom.uploadDropZone.classList.add('dragover');
          });
        });

        ['dragleave', 'drop'].forEach(name => {
          dom.uploadDropZone.addEventListener(name, (e) => {
            e.preventDefault();
            e.stopPropagation();
            dom.uploadDropZone.classList.remove('dragover');
          });
        });

        dom.uploadDropZone.addEventListener('drop', (e) => {
          if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
            handleFiles(Array.from(e.dataTransfer.files));
          }
        });
      }

      function handleFiles(files) {
        if (!files.length) return;
        dom.taskQueueCard.style.display = 'flex';
        files.forEach(file => {
          uploadSingleFile(file);
        });
        showToast(`已排进 ${files.length} 个投送任务`);
      }

      async function uploadSingleFile(file) {
        const CHUNK_SIZE = 1024 * 1024;
        const totalChunks = Math.max(1, Math.ceil(file.size / CHUNK_SIZE));

        // A retry passes the same File back in, so reuse its task row instead of stacking a
        // duplicate. The task keeps the File handle, which is what makes retrying in place
        // possible at all.
        const task = file.portalTask || {
          id: `portal_${Date.now()}_${Math.random().toString(36).substring(2, 7)}`,
          name: file.name,
          size: file.size,
          uploaded: 0,
          status: 'transferring',
          speed: '0 KB/s',
          totalChunks: totalChunks,
          currentChunk: 0
        };
        const taskId = task.id;

        file.portalTask = task;
        task.file = file;
        task.status = 'transferring';
        task.uploaded = 0;
        task.currentChunk = 0;
        task.speed = '0 KB/s';
        task.error = '';
        if (state.tasks.indexOf(task) === -1) state.tasks.unshift(task);
        renderTasks();

        let lastBytes = 0;
        let lastTime = Date.now();

        for (let idx = 0; idx < totalChunks; idx++) {
          const start = idx * CHUNK_SIZE;
          const end = Math.min(file.size, start + CHUNK_SIZE);
          const chunkBlob = file.slice(start, end);

          try {
            if (!session.active) {
              throw new Error('尚未建立加密会话，请先输入配对码');
            }

            // Seal the chunk before it leaves the browser.
            const sealedBlob = await SafeDropCrypto.encryptChunk(
              session.key,
              new Uint8Array(await chunkBlob.arrayBuffer()),
              taskId,
              idx,
              totalChunks,
              CHUNK_SIZE
            );

            const res = await fetch('/api/v1/transfer/upload', {
              method: 'POST',
              headers: withSession({
                'Content-Type': 'application/octet-stream',
                'X-Task-Id': taskId,
                'X-File-Name': encodeURIComponent(file.name),
                'X-File-Size': file.size.toString(),
                'X-Chunk-Index': idx.toString(),
                'X-Chunk-Count': totalChunks.toString(),
                'X-Chunk-Size': CHUNK_SIZE.toString(),
                'X-Encrypted': '1'
              }),
              body: sealedBlob
            });

            if (!res.ok) {
              throw new Error(`HTTP ${res.status}`);
            }

            task.uploaded = end;
            task.currentChunk = idx + 1;

            const now = Date.now();
            const deltaSec = (now - lastTime) / 1000;
            if (deltaSec >= 0.4 || idx === totalChunks - 1) {
              const speedBytes = (task.uploaded - lastBytes) / Math.max(0.1, deltaSec);
              task.speed = formatSpeed(speedBytes);
              lastBytes = task.uploaded;
              lastTime = now;
              renderTasks();
            }
          } catch (err) {
            task.status = 'error';
            task.speed = '已中断';
            task.error = uploadFailureText(err);
            renderTasks();
            return;
          }
        }

        task.status = 'done';
        task.speed = '已送达';
        task.error = '';
        renderTasks();
        showToast(`已把「${file.name}」送到对方端`);
        fetchFiles();
      }

      /** Plain wording for why a send stopped, with the next step in it. */
      function uploadFailureText(err) {
        const raw = String((err && err.message) || err || '');
        if (raw.indexOf('尚未建立加密会话') !== -1) {
          return '还没和对方配对，内容没法加密。输入对方屏幕上的配对码后，点重试。';
        }
        if (raw.indexOf('Failed to fetch') !== -1) {
          return '和对方断开了连接。确认这台手机还连着同一个 Wi-Fi，然后点重试。';
        }
        return `没有传完（${raw}）。文件还在手机上，点重试可以再发一次。`;
      }

      function retryTask(taskId) {
        const task = state.tasks.find(t => t.id === taskId);
        if (!task || !task.file) return;
        if (!session.active) {
          showPinModal('先输入配对码。', '连上之后点重试就能继续发这个文件。');
          return;
        }
        uploadSingleFile(task.file);
      }

      function cancelTask(taskId) {
        state.tasks = state.tasks.filter(t => t.id !== taskId);
        renderTasks();
      }

      function renderTasks() {
        const activeCount = state.tasks.filter(t => t.status === 'transferring').length;
        dom.taskStatsText.textContent = activeCount > 0 ? `进行中 ${activeCount} 项` : '全部任务完成';
        dom.taskQueueCard.style.display = state.tasks.length ? 'flex' : 'none';

        dom.taskItemsContainer.innerHTML = state.tasks.map(t => {
          const pct = t.size === 0 ? 100 : Math.min(100, Math.round((t.uploaded / t.size) * 100));
          const fillClass = t.status === 'done' ? 'done' : (t.status === 'error' ? 'error' : '');
          const badge = t.status === 'done' ? '已完成' : (t.status === 'error' ? '失败' : `${pct}%`);
          const actions = t.status === 'error' ? `
            <div class="task-actions">
              <button type="button" class="btn-mini is-primary" data-retry="${escapeHtml(t.id)}">重试</button>
              <button type="button" class="btn-mini" data-cancel="${escapeHtml(t.id)}">取消</button>
            </div>
          ` : '';
          return `
            <div class="task-item">
              <div class="task-item-head">
                <span class="task-file-name" title="${escapeHtml(t.name)}">${escapeHtml(t.name)}</span>
                <span class="task-status-badge ${t.status}">${badge}</span>
              </div>
              <div class="task-progress-bar">
                <div class="task-progress-fill ${fillClass}" style="width: ${pct}%;"></div>
              </div>
              <div class="task-item-foot">
                <span>${formatBytes(t.uploaded)} / ${formatBytes(t.size)} · ${t.currentChunk}/${t.totalChunks} 块</span>
                <span>${escapeHtml(t.speed || '')}</span>
              </div>
              ${t.error ? `<p class="task-error"><strong>没传完。</strong> ${escapeHtml(t.error)}</p>` : ''}
              ${actions}
            </div>
          `;
        }).join('');

        dom.taskItemsContainer.querySelectorAll('[data-retry]').forEach(btn => {
          btn.addEventListener('click', () => retryTask(btn.getAttribute('data-retry')));
        });
        dom.taskItemsContainer.querySelectorAll('[data-cancel]').forEach(btn => {
          btn.addEventListener('click', () => cancelTask(btn.getAttribute('data-cancel')));
        });
      }

      // 5. Fetch & render files for download
      async function fetchFiles() {
        try {
          const res = await fetch('/api/v1/files/list', { headers: withSession() });
          if (res.ok) {
            const data = await res.json();
            state.files = data.files || [];
            state.filesUpdatedAt = Date.now();
            updateFilesStamp();
            renderFilesList();
          }
        } catch (_) {}
      }

      /** The list polls, so the readout replaces the refresh button. */
      function updateFilesStamp() {
        if (!dom.filesUpdatedAgo) return;
        if (!state.filesUpdatedAt) { dom.filesUpdatedAgo.textContent = '等待读取'; return; }
        const seconds = Math.max(0, Math.round((Date.now() - state.filesUpdatedAt) / 1000));
        dom.filesUpdatedAgo.textContent = seconds < 2 ? '刚刚更新' : (seconds < 60 ? `${seconds} 秒前更新` : `${Math.floor(seconds / 60)} 分钟前更新`);
      }

      function renderFilesList() {
        if (!state.files || state.files.length === 0) {
          dom.filesEmptyPlaceholder.style.display = 'flex';
          dom.filesListContainer.innerHTML = '';
          return;
        }

        dom.filesEmptyPlaceholder.style.display = 'none';
        const rowsHtml = state.files.map(f => {
          const timeStr = f.mtime ? formatTimestamp(f.mtime) : '';
          return `
            <div class="file-row">
              <div class="file-left">
                <div class="file-icon-box">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
                    <polyline points="13 2 13 9 20 9"></polyline>
                  </svg>
                </div>
                <div class="file-meta">
                  <span class="file-name" title="${escapeHtml(f.name)}">${escapeHtml(f.name)}</span>
                  <span class="file-subtext">${formatBytes(f.size || 0)}${timeStr ? ' · ' + timeStr : ''}</span>
                </div>
              </div>
              <button type="button" class="btn-download-file" data-download="${escapeHtml(f.name)}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                  <polyline points="7 10 12 15 17 10"></polyline>
                  <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                <span>存到本机</span>
              </button>
            </div>
          `;
        }).join('');

        // Downloads need the session header, so they cannot be plain anchor links. The rows
        // have to exist before they are wired: binding first and then replacing innerHTML left
        // every download button pointing at nodes that were already gone.
        dom.filesListContainer.innerHTML = rowsHtml;
        dom.filesListContainer.querySelectorAll('[data-download]').forEach((btn) => {
          btn.addEventListener('click', () => downloadFile(btn.getAttribute('data-download')));
        });
      }

      // 5.1 Download a vault file through an authenticated request
      async function downloadFile(name) {
        if (!session.active) {
          showPinModal('先输入配对码。', '对方端要求先配对，才允许取文件。');
          return;
        }
        try {
          const res = await fetch(`/api/v1/files/download/${encodeURIComponent(name)}`, {
            headers: withSession()
          });
          if (!res.ok) {
            throw new Error(`HTTP ${res.status}`);
          }
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = name;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 10000);
          showToast(`开始保存 ${name}`);
        } catch (err) {
          showToast('这个文件没取下来，再试一次');
        }
      }

      // 6. Tabs
      function initTabs() {
        dom.tabBtns.forEach(btn => {
          btn.addEventListener('click', () => {
            const targetId = btn.getAttribute('data-tab');
            dom.tabBtns.forEach(b => b.classList.toggle('active', b === btn));
            dom.sections.forEach(s => s.classList.toggle('active', s.id === targetId));
            if (targetId === 'downloadTab') {
              fetchFiles();
            }
          });
        });
      }

      // 7. Theme
      function initThemeToggle() {
        dom.themeBtn.addEventListener('click', () => {
          const themes = ['dark-theme', 'eyecare-theme', 'light-theme'];
          const idx = themes.indexOf(state.theme);
          const next = themes[(idx + 1) % themes.length];
          applyTheme(next);
        });
      }

      function applyTheme(themeName) {
        state.theme = themeName;
        document.body.className = themeName;
        localStorage.setItem('safedrop_theme', themeName);
      }

      // Helpers
      function formatBytes(bytes) {
        if (!bytes || bytes === 0) return '0 B';
        const k = 1024;
        const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
      }

      function formatSpeed(bytesPerSec) {
        if (!bytesPerSec || bytesPerSec <= 0) return '0 KB/s';
        if (bytesPerSec >= 1024 * 1024) {
          return (bytesPerSec / (1024 * 1024)).toFixed(1) + ' MB/s';
        }
        return (bytesPerSec / 1024).toFixed(0) + ' KB/s';
      }

      /** Fixed-width, no locale: a timestamp here is a reading, not prose. */
      function formatTimestamp(value) {
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return String(value);
        const pad = n => String(n).padStart(2, '0');
        return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
      }

      function escapeHtml(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      let toastTimer = null;
      function showToast(msg) {
        clearTimeout(toastTimer);
        dom.toastBox.textContent = msg;
        dom.toastBox.classList.add('show');
        toastTimer = setTimeout(() => {
          dom.toastBox.classList.remove('show');
        }, 3200);
      }

      init();
    })();
  </script>
</body>
</html>
