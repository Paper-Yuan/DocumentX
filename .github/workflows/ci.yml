name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-desktop:
    name: Test Desktop Hub
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        
    - name: Syntax check every backend and UI script
      run: |
        node --version
        for file in apps/desktop/desktop_hub/*.js apps/desktop/desktop_hub/public/*.js scripts/*.js; do
          node --check "$file"
        done

    - name: Verify the protocol contract and its generated files
      run: |
        node scripts/protocol.js check
        node scripts/gen-vectors.js --check

    - name: Run unit tests
      run: node --test test/*.test.js

    # Section 8 of the transport suite relays a chunk to an address that is not the hub's own.
    # A single-NIC runner has no such address, and the section would skip - which is how the
    # relay path ends up untested while CI still looks green. Give the runner one instead.
    # The suite prints which default rule the destination was allowed under: on this address it
    # is the RFC1918 range rather than on-link, and the on-link rule has its own unit test.
    - name: Give the runner a second local address for the relay test
      run: |
        sudo ip -4 addr add 192.168.250.1/24 dev lo
        ip -4 addr show dev lo | grep -q 192.168.250.1

    - name: Run the transport encryption end-to-end suite
      run: node test/e2e/encryption_e2e.js

    - name: Run the relay and portal security suite
      run: node test/e2e/qr_and_security.js

    - name: Run the multi-device and portal suite
      run: node test/e2e/multi_device_and_portal.js

    # These three guard the design contract itself - no remote fonts, no gradient chrome, every
    # theme defining the same token set - so a future pass cannot quietly reintroduce the
    # template look that this rebuild spent itself removing.
    - name: Run the interface contract suites
      run: |
        node test/e2e/theme_and_device_display.js
        node test/e2e/new_chat_and_layout_features.js
        node test/e2e/scrollbar_and_copy_features.js
        
  test-android:
    name: Test Android
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Validate Gradle wrapper
      uses: gradle/wrapper-validation-action@v1

    # The project only commits the Windows wrapper script, so CI drives Gradle directly at the
    # version gradle-wrapper.properties pins rather than inventing a wrapper on the fly.
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'

    # The unit tests read test/vectors/e2e-v2.json, which scripts/gen-vectors.js writes from the
    # Node implementation, so a green run here means the two implementations agree byte for byte.
    # That only holds while CI actually runs them, which is the whole point of this job.
    - name: Run the crypto unit tests against the shared golden vectors
      timeout-minutes: 25
      working-directory: apps/android/com
      run: gradle --no-daemon testDebugUnitTest

    - name: Upload the test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: android-unit-tests
        path: apps/android/com/app/build/test-results/testDebugUnitTest/*.xml
        if-no-files-found: error
        
  lint-kotlin:
    name: Lint Kotlin Code
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Check Kotlin files exist
      run: |
        find apps/android -name "*.kt" -type f | head -5
        echo "✅ Kotlin source files found"
        
  check-docs:
    name: Check Documentation
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Verify essential docs
      run: |
        test -f README.md && echo "✅ README.md exists"
        test -f LICENSE && echo "⚠️  LICENSE recommended" || true
        test -f CHANGELOG.md && echo "✅ CHANGELOG.md exists" || true

  check-version:
    name: Version Consistency
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Assert all version strings agree with the hub's APP_VERSION
      run: node scripts/version-check.js
