[package]
name = "safedrop-desktop"
version = "1.1.0"
description = "SafeDrop Desktop Hub - Cross-platform secure file transfer"
authors = ["SafeDrop Team"]
license = "MIT"
repository = "https://github.com/safedrop/safedrop"
edition = "2021"

# Optimize for smaller binary size
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [
    "tray-icon"
] }
tauri-plugin-shell = "2.0"
tauri-plugin-global-shortcut = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }
reqwest = { version = "0.11", features = ["blocking"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
