name: safedrop_desktop
description: "Cross-platform secure high-speed file transfer system - Windows Desktop Hub"
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Design System (Fluent 2 for Windows)
  fluent_ui: ^4.9.0
  window_manager: ^0.3.9
  desktop_drop: ^0.4.4
  qr_flutter: ^4.1.0

  # Cryptography & Security Engine
  cryptography: ^2.7.0

  # State Management
  flutter_riverpod: ^2.5.1

  # Network & Embedded Server
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  http: ^1.2.1
  multicast_dns: ^0.3.2+6

  # Native Desktop Integration & System Tray
  system_tray: ^2.0.3
  local_notifier: ^0.1.5

  # Storage & SQLite
  sqlite3: ^2.4.4
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Utilities
  uuid: ^3.0.7
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/
