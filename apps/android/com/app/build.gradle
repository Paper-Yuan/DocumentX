plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.safedrop.mobile'
    compileSdk 34

    defaultConfig {
        applicationId "com.safedrop.mobile"
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName "1.3.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        // A real release keystore is loaded from keystore.properties (gitignored) or from
        // SAFEDROP_KEYSTORE_* environment variables. Neither is committed, so a fresh clone
        // still builds; it just cannot produce a distributable release signature.
        release {
            def propsFile = rootProject.file('keystore.properties')
            def props = new Properties()
            def fromFile = propsFile.exists()
            if (fromFile) {
                propsFile.withInputStream { props.load(it) }
            }

            def storePath = fromFile ? props['storeFile'] : System.getenv('SAFEDROP_KEYSTORE_FILE')
            def storePasswordValue = fromFile ? props['storePassword'] : System.getenv('SAFEDROP_KEYSTORE_PASSWORD')
            def keyAliasValue = fromFile ? props['keyAlias'] : System.getenv('SAFEDROP_KEY_ALIAS')
            def keyPasswordValue = fromFile ? props['keyPassword'] : System.getenv('SAFEDROP_KEY_PASSWORD')

            if (storePath && storePasswordValue && keyAliasValue && keyPasswordValue) {
                storeFile rootProject.file(storePath)
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Fall back to the debug key only when no release keystore is configured, so the
            // build still succeeds locally. Such an APK is not distributable.
            signingConfig signingConfigs.release.storeFile != null
                ? signingConfigs.release
                : signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
            "-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi",
            "-opt-in=androidx.camera.core.ExperimentalGetImage",
            "-Xjvm-default=all"
        ]
    }

    buildFeatures {
        viewBinding true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // AndroidX & Core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'

    // Google Material 3 Design
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // CameraX for QR Scanning
    def camerax_version = "1.3.1"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // Google ML Kit Barcode Scanning
    implementation 'com.google.mlkit:barcode-scanning:17.2.0'

    // Cryptography & Security (BouncyCastle for X25519 & HKDF, Android KeyStore)
    implementation 'org.bouncycastle:bcprov-jdk18on:1.77'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Network & Streaming (OkHttp3 for 1MB Chunked Streaming & WebSocket/REST)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    // Kotlin Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // QR Code Generation
    implementation 'com.google.zxing:core:3.5.3'

    // Unit Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
